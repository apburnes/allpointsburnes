name: Run tests and deploy

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 11.4.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --config.strictDepBuilds=false

      - name: Rebuild approved native/build-script dependencies
        run: pnpm rebuild esbuild sharp workerd

      - name: Run tests
        working-directory: apps/site
        run: NODE_ENV=test ./node_modules/.bin/vitest --coverage --no-watch

      - name: Build app
        working-directory: apps/site
        run: node ./scripts/generate-llms.mjs && ./node_modules/.bin/astro check && ./node_modules/.bin/astro build

      - name: Deploy apps
        working-directory: apps/site
        run: bash ./ci/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
